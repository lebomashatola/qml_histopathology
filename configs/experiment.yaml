# ============================================================
# DATA
# ============================================================

data:

  # "hact" or "full"
  source: "hact"

  # Only used when source is "full": 10, 32, or 64
  dimensions: 10


# ============================================================
# RESULTS
# ============================================================

results_dir: "../results"


# ============================================================
# QUANTUM MACHINE LEARNING
# ============================================================

quantum:

  # ideal, noisy, hardware
  mode: "hardware"

  # efficient_su2 or two_local
  ansatz: "efficient_su2"
  ansatz_reps: 2

  # COBYLA or SPSA
  optimizer: "COBYLA"

  maxiter: 30
  shots: 1024

  # IBM Quantum configuration
  ibm_config: "configs/credentials.json"

# ============================================================
# CLASSICAL BENCHMARK
# ============================================================

classical:

  # Keep this simple: three models
  models:
    - "logistic_regression"
    - "random_forest"
    - "mlp"

  mlp:
    hidden_layer_sizes: [64, 32]
    max_iter: 100
    random_state: 42

  random_forest:
    n_estimators: 100
    random_state: 42

  logistic_regression:
    max_iter: 1000
    random_state: 42


# ============================================================
# GENERAL
# ============================================================

random_state: 42
